name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-smoke-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile source
        run: python -m compileall -q main.py src

      - name: Check command entry points
        run: |
          python main.py --help
          python -m hand_reveal --help
          hand-reveal --help

      - name: Check imports
        run: python -c "from hand_reveal.app import run; from hand_reveal.renderer import Projector; from hand_reveal.detector import create_hand_tracker"
