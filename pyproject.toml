[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-hand-reveal"
version = "0.2.0"
description = "Real-time hand-tracking image reveal using MediaPipe and OpenCV"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mediapipe>=0.10,<2",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.9,<6",
]

[project.optional-dependencies]
fallback = ["cvzone>=1.6,<2"]

[project.scripts]
hand-reveal = "hand_reveal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
